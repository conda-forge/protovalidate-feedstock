schema_version: 1

context:
  version: "2.1.0"

package:
  name: protovalidate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/protovalidate/protovalidate-${{ version }}.tar.gz
  sha256: d2f66bd8c7e8c4929116ad598348e83d90bd718f0387f2307b34f83b1740f318

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv
      # protovalidate imports buf.validate.validate_pb2, which the wheel does
      # not ship. Install upstream's generated copy from gen/ so the package
      # works on its own.
      - ${{ PYTHON }} ${{ RECIPE_DIR }}/install_buf_validate.py

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - cel-python >=0.5
    # Upstream raises these floors with python_version markers (re2 for 3.12+,
    # protobuf for 3.14). noarch can't carry markers, so use the highest floor.
    - google-re2 >=1.1.20251105
    - protobuf >=6.31.0

tests:
  - python:
      imports:
        - protovalidate
        - buf.validate.validate_pb2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        # Test protos. gen/buf is left out so the installed buf.validate is used.
        - test/
        - gen/cel/
        - gen/tests/
    requirements:
      run:
        - pytest
    script:
      env:
        # Same as upstream's Makefile.
        PYTHONPATH: gen
      content:
        - pytest -v test

about:
  homepage: https://github.com/bufbuild/protovalidate-python
  repository: https://github.com/bufbuild/protovalidate-python
  documentation: https://protovalidate.com
  summary: Protocol Buffer Validation for Python
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
